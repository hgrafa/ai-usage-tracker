name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version from the tag
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "marketing=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "marketing=0.1.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build disk image
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.marketing }}
          CURRENT_PROJECT_VERSION: ${{ github.run_number }}
        run: scripts/package-dmg.sh

      - name: Sign the update feed
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: scripts/make-appcast.sh "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/"

      - name: Attach disk image to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AI-Usage.dmg
            dist/appcast.xml
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload disk image
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: AI-Usage
          path: dist/AI-Usage.dmg
